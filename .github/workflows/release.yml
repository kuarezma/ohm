name: Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run release (no signing/notarization)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Release Build & Package
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          if [ -d "/Applications/Xcode_27.app" ]; then
            sudo xcode-select -s /Applications/Xcode_27.app
          elif [ -d "/Applications/Xcode_27.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app
          fi
          xcodebuild -version

      - name: Install xcodegen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Run Release Pipeline (Developer ID, Notarize, Staple, Zip)
        env:
          DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          chmod +x scripts/ci/release.sh
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            scripts/ci/release.sh --dry-run
          else
            scripts/ci/release.sh
          fi

      - name: Upload Release Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ohm-release-${{ github.ref_name }}
          path: |
            build/ci/Ohm-*.zip
            build/ci/Ohm-*.sha256

      - name: Determine Release Mode
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
        id: release_info
        run: |
          if compgen -G "build/ci/Ohm-*-preview.zip" > /dev/null; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release_name=Ohm ${{ github.ref_name }} (Preview)" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "release_name=Ohm ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ci/Ohm-*.zip
            build/ci/Ohm-*.sha256
          name: ${{ steps.release_info.outputs.release_name }}
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}
          generate_release_notes: true

      # TODO(Sparkle): kullanıcı onayı bekleniyor
      # - name: Generate Sparkle Appcast
      #   if: false
      #   run: |
      #     echo "Sparkle appcast generation is disabled pending user decision."
